ext {
    // All flavors share ONE version, read from app/gradle.properties
    // (appCodeNumber / appVersionNumberBase / appVersionNumberIndex).
    // The fdroid-fixed 9.4.21/7174 override was removed 2026-09-02: version
    // numbers are unified (currently 1.0.0/7200) across google/pro/fdroid.
    codeNumber = Integer.parseInt(appCodeNumber)
    versionNumber = appVersionNumberBase + "." + appVersionNumberIndex

    println ""
    println "Version: [" + versionNumber + " - " + codeNumber + "]"
}

// Generates com.foobnix.pdf.info.BuildTime with the compilation timestamp on
// every build (shown on the 杞欢璇存槑 page). A generated source file instead of
// buildConfigField: the configuration cache would freeze a buildConfigField
// value, so incremental builds would show a stale time.
def genBuildTime = tasks.register("generateBuildTimeSource") {
    def outDir = layout.buildDirectory.dir("generated/buildTime/com/foobnix/pdf/info")
    outputs.file(outDir.map { it.file("BuildTime.java") })
    // no inputs declared: without this Gradle treats the task as UP-TO-DATE
    // once the file exists and skips it on incremental builds, freezing the
    // timestamp at the first (clean) build
    outputs.upToDateWhen { false }
    doLast {
        def f = outDir.get().file("BuildTime.java").asFile
        f.parentFile.mkdirs()
        f.text = """package com.foobnix.pdf.info;

/** Generated by the build: compilation timestamp of this APK. */
public final class BuildTime {
    public static final String BUILD_TIME = "${new Date().format("yyyyMMddHHmm")}";

    private BuildTime() {
    }
}
"""
    }
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(genBuildTime)
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    namespace = "com.foobnix.pdf.info"

    sourceSets {
        main {
            java {
                srcDir(layout.buildDirectory.dir("generated/buildTime"))
            }
        }
    }

    defaultConfig {
        namespace = "com.foobnix.pdf.info"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = codeNumber
        versionName = versionNumber
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }

    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }

    lint {
        abortOnError = true
        ignoreWarnings = true
        checkReleaseBuilds = taskName.contains("Pro")
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    signingConfigs {
        release {
            // signing props are optional now: Debug builds never use this config,
            // and real values (if configured via -P or gradle.properties) still win
            storeFile file(project.findProperty('RELEASE_STORE_FILE') ?: 'placeholder-release.keystore')
            storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: 'placeholder'
            keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: 'placeholder'
            keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: 'placeholder'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            //shrinkResources = false
            signingConfig = signingConfigs.release
            debuggable = false
        }
        debug {
            debuggable = true
        }
    }


    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.jvmTarget.get())
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }

    splits {
        abi {
            enable = true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk = true
        }
    }

    // Google's official SAMPLE AdMob APPLICATION_ID
    // (https://developers.google.com/admob/android/test-ads). Linking
    // play-services-ads (libDepFree) puts MobileAdsInitProvider into the
    // merged manifest, and a missing/invalid APPLICATION_ID meta-data is a
    // fatal crash at app start — so the ad-capable flavor needs a VALID app
    // id even while ads stay dormant. The sample id only lets the SDK pass
    // validation; the ad-unit placeholders (banner/full/reward) default to
    // EMPTY and the empty-ID guards in AdMobAdsProvider keep every
    // load/show call a no-op, so no ad is ever requested. Real activation =
    // set pro_admobAppId/pro_admobBannerId/... in ~/.gradle/gradle.properties.
    def sampleAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'

    // Ad-provider property lookup: new keys are prefixed with the flavor name
    // (pro_admobAppId etc.); the howread_* keys (2026-09-07..09 naming) and the
    // legacy google_* keys on the build server's ~/.gradle/gradle.properties
    // still win as a fallback so nothing breaks until they are renamed.
    def flavorProp = { String base ->
        project.findProperty("pro_${base}") ?: project.findProperty("howread_${base}") ?: project.findProperty("google_${base}")
    }

    flavorDimensions.add("version")
    productFlavors {
        fdroid {
            minSdk = libs.versions.minSdk.get().toInteger()
            dimension = "version"
            applicationId = "com.leestudio.howread.fd.reader"
            manifestPlaceholders = [
                    appName      : "HowRead Fd",
                    appIcon      : "@mipmap/icon_pdf_pro",
                    appRoundIcon : "@mipmap/icon_pdf_pro",
                    appGdriveKey : "",
                    admobAppId   : "",
                    admobBannerId: "",
                    admobFullId  : "",
                    admobRewardId  : "",
                    appSafeMode  : "true"
            ]
        }

        // The ad+IAP flagship (Play channel). Ad SDK is WIRED but DORMANT:
        // the src/admobAds manifest IS merged (a valid APPLICATION_ID is
        // mandatory once play-services-ads is linked — see the sample-id
        // comment above) but the ad-unit placeholders default to EMPTY and
        // the empty-ID guards in AdMobAdsProvider keep all load/show calls
        // no-ops, so no ad is ever requested. To activate ads later: set
        // pro_admobAppId / pro_admobBannerId / pro_admobFullId /
        // pro_admobRewardId in ~/.gradle/gradle.properties. IAP is an
        // interface-level reservation (see mobi.librera.libgoogle.BillingManager
        // in src/main) — no billing SDK is linked yet.
        pro {
            dimension = "version"
            applicationId = "com.leestudio.howread.pro.reader"
            manifestPlaceholders = [
                    appName      : "HowRead Pro",
                    appIcon      : "@mipmap/icon_pdf_pro",
                    appRoundIcon : "@mipmap/icon_pdf_pro",
                    appGdriveKey : project.findProperty('pro_appGdriveKey') ?: '',
                    admobAppId   : flavorProp('admobAppId') ?: sampleAdmobAppId,
                    admobBannerId: flavorProp('admobBannerId') ?: '',
                    admobFullId  : flavorProp('admobFullId') ?: '',
                    admobRewardId  : flavorProp('admobRewardId') ?: '',
                    appSafeMode  : "false"
            ]
        }
    }

    def abiCodes = ['armeabi-v7a': 0, 'arm64-v8a': 1, 'x86': 2, 'x86_64': 3]

    applicationVariants.all { variant ->

        variant.outputs.all { output ->

            def flavor = variant.productFlavors[0].name.capitalize()
            def abiName = getFilter("ABI")
/*            if (abiName == "armeabi-v7a") {
                variant.mergedFlavor.manifestPlaceholders.appSafeMode = "true"
                //variant.resValue "string", "[appSafeMode]", "true"
                println abiName + " : appSafeMode true "
            } else {
                variant.mergedFlavor.manifestPlaceholders.appSafeMode = "true"
                //variant.resValue "string", "[appSafeMode]", "false"
                println abiName + " : appSafeMode false"
            }
*/
                if (abiName != null) {
                    def code = abiCodes.get(abiName, 0) + variant.versionCode
                    abiName = abiName.replace("arm64-v8a", "arm64").replace("armeabi-v7a", "arm")

                    output.versionCodeOverride = code
                    // every flavor keeps its tag in the file name
                    // (HowRead-Pro-… / HowRead-Fdroid-…)
                    def brand = "HowRead-" + flavor

                    def fullName = "${brand}-v${versionNumber}-${abiName}.apk"

                    output.outputFileName = fullName
                } else {
                    def brand = "HowRead-" + flavor
                    def fullName = "${brand}-v${versionNumber}-uni.apk"
                output.versionCodeOverride = codeNumber
                output.outputFileName = fullName
            }
        }
    }

    sourceSets {
        fdroid { assets.srcDirs = ['src/fdroid/assets', 'src/fdroid/assets/'] }
        // The GMS-free flavor (fdroid) compiles the no-op ad provider from
        // src/noAds so its APK contains no ad-SDK calls at all (F-Droid
        // requirement). Google Drive / GMS was removed from all builds (2026-09),
        // so there is no longer a gmsStubs source set to mount.
        fdroid { java.srcDirs += ['src/noAds/java'] }
        // pro compiles the REAL AdMob provider, wired but DORMANT: the
        // manifest merge below is mandatory (play-services-ads injects
        // MobileAdsInitProvider, and a missing APPLICATION_ID meta-data is a
        // fatal crash at app start), yet the ad-UNIT placeholders default to
        // EMPTY so AdMobAdsProvider's empty-ID guards keep every load/show
        // call a no-op — no ad is ever requested. fdroid compiles the no-op
        // provider so its APK contains no ad-SDK calls at all (F-Droid
        // requirement). Both groups provide the same AdsProviderFactory class
        // name, like the LibreraBuildConfig pattern — never compiled into the
        // same variant.
        pro { java.srcDirs += ['src/admobAds/java'] }
        pro { manifest.srcFile('src/admobAds/AndroidManifest.xml') }
        // Native libraries are vendored under prebuilt/native/ at the REPO ROOT
        // (committed .so for all 4 ABIs, shared layer beside Builder/). Setting
        // srcDirs replaces the default src/main/jniLibs lookup so Gradle packages
        // the prebuilt .so directly (see Builder/prepare-native.sh for the
        // source-build fallback). rootDir is android/ (this gradle project).
        main { jniLibs.srcDirs = ["${rootDir}/../prebuilt/native/mupdf-1.23.7"] }
    }

    // Ad-provider implementation sources live in src/admobAds (real AdMob +
    // UMP, pulled into pro via libDepFree) and src/noAds (no-op, fdroid only).
    // Dormant-vs-active is decided purely by the ad-unit placeholders
    // (see the productFlavors comment on the pro block): activation =
    // set pro_admobAppId / pro_admobBannerId / pro_admobFullId /
    // pro_admobRewardId in ~/.gradle/gradle.properties. fdroid stays
    // GMS-free (no ad SDK at all).

    packagingOptions {
        resources {
            excludes.addAll(
                    'META-INF/DEPENDENCIES',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.txt',
                    'META-INF/INDEX.LIST',
            )
        }
    }
}

// sardine-android brings okhttp 4.x transitively; this app pins okhttp 3.12.6
// ("app not compatible with new versions"). Sardine only uses the stable public
// okhttp API (Response/Request/OkHttpClient/Interceptor/Authenticator), so force
// the app-wide okhttp version back to 3.12.6.
configurations.configureEach {
    resolutionStrategy {
        force 'com.squareup.okhttp3:okhttp:3.12.6'
    }
}

