# HowRead 自动测试用例参数（层级/优先级/超时/重试 全局在此配置）
# 实际包名以 devices.json 的 flavors.<flavor>.applicationId 为准（run_all.py 从这里解析）；
# 下面两行仅为历史兼容保留，2026-09-07 重品牌后同步为 leestudio 包名
package: com.leestudio.howread.fd.reader
package_pro: com.leestudio.howread.pro.reader
main_activity: com.foobnix.ui2.MainTabs2

launcher_timeout_s: 10
ui_timeout_s: 8
step_screenshot: true
heartbeat_s: 30          # >30s 的操作打印心跳行
case_timeout_s: 300      # 单用例默认超时
case_retries: 1          # 默认失败重试次数

# 冷启动耗时阈值（ms），按设备型号覆盖（key 须与 devices.json 的 model 完全一致）。
# 2026-09-12 实测：P20 中位 2565ms / KSA 6691ms（Displayed 首帧，已修复测量失配），
# 冷启优化另行立项处理；本表对低端机先放宽，避免门禁误报。
cold_start_threshold_ms:
  default: 2000
  "SNE-AL00 (P20)": 3000
  "KSA-AL10": 8000

stability_monkey:
  duration_s: 300        # 试跑 5 分钟；正式门禁夜跑改 1800
  throttle_ms: 300
  seed: 20260906

webdav:
  server_py: Z:/opt/librera/test_webdav.py
  port: 8765
  user: howread
  password: howread123

ai_mock:
  script: tools/ai_mock.py
  port: 8770
  model: howread-test-model
  # 测试时把应用 AI 配置指向 http://<PC-IP>:8770/v1 即可，无需真实 API key

# 50.23 协议测试服务器（AGENTS.md「网络协议测试服务器」，三协议统一账号 howread/howread123）
# FN-26/27/28/29/30 网络用例使用；WebDAV 根 /srv/webdav/、SMB share testbooks、SFTP /home/howread/books/
test_server:
  host: 192.168.50.23
  webdav_url: http://192.168.50.23:8765/
  webdav_user: howread
  webdav_password: howread123
  smb_share: testbooks
  smb_port: 445
  sftp_port: 22
  user: howread
  password: howread123
  books_dir: /home/howread/books

# AI 大模型测试配置（AGENTS.md「AI 大模型测试配置」：智谱 v4 为 OpenAI 兼容，协议选 openai）
# FN-23 AI 配置与连通用例使用（真机走真外网调 glm-4-flash）
ai_test:
  protocol: openai
  base_url: https://open.bigmodel.cn/api/paas/v4/
  api_key: 4bd91d803b234c9dbf2f7f2675cd49f6.l88tfpAXnzWLUwVe
  model: glm-4-flash

