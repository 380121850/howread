<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HowReadPro 在线阅读器 Online Book Reader (EPUB, MOBI, PDF, FB2, CBZ, TXT)</title>
<link rel="icon" href="../web/256.png" type="image/png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #525659; overflow: hidden; }
  #chooser {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; color: #ddd;
    background: radial-gradient(1200px 600px at 50% 20%, #5a5e63, #4a4d51);
  }
  #chooser h1 { font-size: 26px; margin: 0; font-weight: 500; }
  #chooser h1 span { color: #9fb4ff; }
  #chooser p.sub { margin: 0 0 6px; color: #bbb; font-size: 14px; }
  #dropzone {
    width: min(560px, 86vw); border: 2px dashed #888; border-radius: 12px;
    padding: 34px 20px; text-align: center; color: #bbb; font-size: 14px;
    transition: all .15s; cursor: pointer;
  }
  #dropzone.drag { border-color: #9fb4ff; background: rgba(159,180,255,.08); color: #cdd6ff; }
  #dropzone .big { font-size: 34px; margin-bottom: 8px; }
  #openBtn {
    background: #3f51b5; color: #fff; border: none; border-radius: 6px;
    padding: 10px 26px; font-size: 15px; cursor: pointer;
  }
  #openBtn:hover { background: #4d5fce; }
  #urlrow { display: flex; gap: 8px; width: min(560px, 86vw); }
  #urlInput {
    flex: 1; background: #3c3f43; border: 1px solid #666; border-radius: 6px;
    color: #eee; padding: 9px 12px; font-size: 13px;
  }
  #urlBtn { background: #444; color: #eee; border: 1px solid #666; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  #formats { color: #999; font-size: 12px; }
  #stage { position: absolute; inset: 0; display: none; }
  #stage.on { display: block; }
  iframe { border: none; width: 100%; height: 100%; }
  #backBtn {
    position: absolute; top: 6px; right: 10px; z-index: 30; display: none;
    background: rgba(43,43,43,.85); color: #eee; border: 1px solid #666; border-radius: 6px;
    padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  #backBtn.on { display: block; }
  #loader {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ddd; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px;
    flex-direction: column; gap: 10px; background: #525659; z-index: 25;
  }
  #loader.on { display: flex; }
</style>
</head>
<body>
<div id="chooser">
  <h1>HowReadPro <span>在线阅读</span> Online Reader</h1>
  <p class="sub">在浏览器中直接阅读电子书，无需安装 Read books in your browser, no install needed</p>
  <div id="dropzone">
    <div class="big">📚</div>
    拖放文件到这里，或点击选择<br>Drop a file here, or click to choose
  </div>
  <button id="openBtn">打开文件 Open file</button>
  <div id="urlrow">
    <input id="urlInput" placeholder="或输入文档 URL (https://… .pdf / .epub)">
    <button id="urlBtn">打开</button>
  </div>
  <div id="formats">支持 Supported: PDF · EPUB · MOBI · AZW3 · FB2 · CBZ · TXT</div>
</div>
<div id="stage"><iframe id="pdfframe" title="PDF viewer"></iframe></div>
<div id="readerhost" style="position:absolute;inset:0;display:none"></div>
<button id="backBtn" title="返回首页">← 首页</button>
<div id="loader"><div>正在打开文档… Opening document…</div></div>
<input type="file" id="fileInput" accept=".pdf,.epub,.mobi,.azw3,.azw,.fb2,.cbz,.zip,.txt" hidden>

<script type="module">
import { mountReader } from './reader/reader-page.js?v=20260905b'
import { txtToEpubBlob } from './reader/txt-to-epub.js?v=20260905b'
import { saveSession, loadSession } from './reader/session.js?v=20260905b'

const $ = id => document.getElementById(id)
const params = new URLSearchParams(location.search)
const fileParam = params.get('file')

const isPdf = name => /\.pdf$/i.test(name || '')
const showStage = on => {
  $('chooser').style.display = on ? 'none' : 'flex'
  $('stage').classList.toggle('on', on)
  $('backBtn').classList.toggle('on', on)
}

// --- last-session persistence (IndexedDB) ---
let sessionRec = null
let sessionSaveTimer = null
function persistSession() {
  if (!sessionRec) return
  clearTimeout(sessionSaveTimer)
  sessionSaveTimer = setTimeout(() => saveSession(sessionRec), 800)
}
window.addEventListener('message', e => {
  if (e.data?.type === 'hr-pdf-page' && sessionRec) {
    sessionRec.pos = { ...(sessionRec.pos || {}), page: e.data.page }
    persistSession()
  }
})

function openPdf(url, name, page) {
  showStage(true)
  $('pdfframe').src = 'pdf/viewer.html?file=' + encodeURIComponent(url) + '&name=' + encodeURIComponent(name || '') + (page ? '&page=' + page : '')
}

async function openOther(urlOrBlob, name, initialPos) {
  showStage(true)
  // the reader must be visible while mounting — foliate needs real layout
  // to resolve page positions (goTo/CFI never settles inside a hidden container)
  $('readerhost').style.display = 'block'
  $('loader').classList.add('on')
  $('loader').innerHTML = '<div>正在打开文档… Opening document…</div>'
  try {
    let target = urlOrBlob
    if (/\.txt$/i.test(name || '')) target = await txtToEpubBlob(urlOrBlob)
    await mountReader(target, $('readerhost'), {
      title: (name || '').replace(/\.[^.]+$/, ''),
      initialPos,
      onBack: () => {
        $('readerhost').style.display = 'none'
        $('readerhost').innerHTML = ''
        showStage(false)
      },
      onProgress: pos => {
        if (sessionRec) {
          sessionRec.pos = { ...(sessionRec.pos || {}), ...pos }
          persistSession()
        }
      },
    })
    window.dispatchEvent(new Event('resize'))
  } catch (err) {
    // keep the loader visible: it doubles as the error banner
    $('readerhost').innerHTML = ''
    $('loader').innerHTML = '<div>打开失败 Failed to open: ' + (err?.message || err) + '</div>'
    return
  }
  $('loader').classList.remove('on')
}

// remember what is being read; local files are kept as blobs so a refresh reopens them
function remember(source, name, pos) {
  sessionRec = {
    name,
    type: isPdf(name) ? 'pdf' : 'book',
    blob: typeof source === 'string' ? null : source,
    url: typeof source === 'string' ? source : null,
    pos: pos || {},
  }
  persistSession()
}

function route(source, name, pos) {
  remember(source, name, pos)
  if (isPdf(source)) {
    openPdf(source, name, pos?.page)
  } else {
    openOther(source, name, pos)
  }
}

function handleFile(file) {
  if (!file) return
  sessionRec = null // a new file starts a fresh position
  const blobUrl = URL.createObjectURL(file)
  if (isPdf(file.name)) {
    openPdf(blobUrl, file.name)
  } else {
    openOther(file, file.name)
  }
  remember(file, file.name)
}

$('openBtn').addEventListener('click', () => $('fileInput').click())
$('dropzone').addEventListener('click', () => $('fileInput').click())
$('fileInput').addEventListener('change', e => handleFile(e.target.files[0]))
$('dropzone').addEventListener('dragover', e => { e.preventDefault(); $('dropzone').classList.add('drag') })
$('dropzone').addEventListener('dragleave', () => $('dropzone').classList.remove('drag'))
$('dropzone').addEventListener('drop', e => {
  e.preventDefault()
  $('dropzone').classList.remove('drag')
  handleFile(e.dataTransfer.files[0])
})
$('urlBtn').addEventListener('click', () => {
  const url = $('urlInput').value.trim()
  if (url) route(url, url, sessionRec?.url === url ? sessionRec?.pos : undefined)
})
$('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('urlBtn').click() })
$('backBtn').addEventListener('click', () => {
  $('pdfframe').src = 'about:blank'
  $('readerhost').style.display = 'none'
  $('readerhost').innerHTML = ''
  showStage(false)
})

// direct link support: ?file=<url> — takes precedence, but resume position if it
// is the same book as the saved session
if (fileParam) {
  const name = params.get('name') || decodeURIComponent(fileParam.split('/').pop() || '')
  loadSession().then(rec => {
    const same = rec && rec.url === fileParam
    if (same) sessionRec = rec
    route(fileParam, name, same ? rec.pos : undefined)
  })
} else {
  // reopen the last book so a refresh stays in the reading view
  loadSession().then(rec => {
    if (!rec) return
    sessionRec = rec
    if (rec.type === 'pdf' && rec.blob) {
      openPdf(URL.createObjectURL(rec.blob), rec.name, rec.pos?.page)
    } else if (rec.blob) {
      openOther(rec.blob, rec.name, rec.pos)
    } else if (rec.url) {
      route(rec.url, rec.name, rec.pos)
    }
  })
}
</script>
</body>
</html>
